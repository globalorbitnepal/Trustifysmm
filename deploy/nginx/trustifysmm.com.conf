# TrustifySMM — Next.js via PM2 on 127.0.0.1:3036
# Install:
#   sudo cp deploy/nginx/trustifysmm.com.conf /etc/nginx/sites-available/trustifysmm.com
#   sudo ln -sf /etc/nginx/sites-available/trustifysmm.com /etc/nginx/sites-enabled/trustifysmm.com
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (after DNS A → this server):
#   sudo certbot --nginx -d trustifysmm.com -d www.trustifysmm.com

upstream trustifysmm_app {
    server 127.0.0.1:3036;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name trustifysmm.com www.trustifysmm.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        proxy_pass http://trustifysmm_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}